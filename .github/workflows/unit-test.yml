name: unit-test-coverage

on:
  push:
  pull_request:
    branches:
      - staging
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}
  
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN_COVERAGE }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: Cache Node.js modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Configure npm authentication
      run: |
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

    - name: Install dependencies
      run: npm install
      continue-on-error: true

    - name: Run Linter
      run: npm run lint
      continue-on-error: true

    - name: Build project
      run: npm run build
      continue-on-error: true

    - name: Run tests
      run: npm run test
      continue-on-error: true

    - name: Run tests with coverage
      run: npm run test:cov
      continue-on-error: true

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage
        retention-days: 7

    - name: Update pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: coverage/lcov-report
        name: github-pages

  deploy-github-pages:
    if: github.ref == 'refs/heads/dev'
    needs: build-and-test
    permissions:
      pages: write 
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Deploy to GitHub Pages
      id:   deployment
      uses: actions/deploy-pages@v4

  check-coverage-threshold:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage-report
        path: coverage

    - name: Check coverage threshold
      run: |
        if [ ! -f coverage/coverage-summary.json ]; then
          echo "❌ coverage-summary.json not found at expected path."
          echo "Contents of coverage/ directory:"
          ls -R coverage
          exit 0
        fi
    
        COVERAGE=$(node -e "const summary = require('./coverage/coverage-summary.json'); console.log(summary.total.lines.pct);")
        echo "Coverage: $COVERAGE%"
        THRESHOLD=70
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
          exit 1
        else
          echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
        fi